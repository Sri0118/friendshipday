<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Friendship Day</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ffd89b,#a18cd1);background-size:400% 400%;animation:bg 12s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#particles span{position:absolute;bottom:-50px;font-size:24px;animation:up linear infinite}
@keyframes up{to{transform:translateY(-120vh) rotate(360deg);opacity:0}}
.card{position:relative;z-index:2;width:min(92%,760px);padding:35px;border-radius:25px;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);color:#fff;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.3);animation:fade 1s}
@keyframes fade{from{opacity:0;transform:translateY(40px)}}
h1{font-size:46px;animation:glow 2s infinite alternate}
@keyframes glow{to{text-shadow:0 0 20px #fff,0 0 40px #ff4d88}}
h2{color:#fff59d;margin:15px 0}
#msg{font-size:21px;line-height:1.8;min-height:240px;white-space:pre-wrap}
button{margin:10px;padding:14px 28px;border:none;border-radius:40px;background:#ff4081;color:#fff;font-size:18px;cursor:pointer}
#modal{display:none;position:fixed;inset:0;background:#0008;justify-content:center;align-items:center;z-index:5}
#box{background:#fff;color:#444;padding:25px;border-radius:20px;max-width:400px;text-align:center}
canvas{position:fixed;inset:0;pointer-events:none}
</style></head><body>
<div id="particles"></div>
<canvas id="cv"></canvas>
<div class="card">
<h1>💖 Happy Friendship Day 💖</h1>
<h2>Dear Vanisri Shivanolla ❤️</h2>
<p id="msg"></p>

<button onclick="showSurprise()">🎁 Don't Click Here ❤️</button>
</div>
<div id="surpriseModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;z-index:10;">
    <div style="background:#fff;padding:20px;border-radius:20px;text-align:center;max-width:500px;">
        <h2 style="color:#ff4081;">🎉 Happy Friendship Day 🎉</h2>

        <!-- Replace friendship-day.jpg with your image -->
        <img src="friend.jpg"
             alt="Friendship Day"
             style="width:100%;max-width:400px;border-radius:15px;margin:15px 0;box-shadow:0 5px 15px rgba(0,0,0,.3);">

        <p style="color:#444;font-size:18px;">
            🌸 Wishing you endless happiness, laughter, and beautiful memories.
            Thank you for being such a wonderful friend! 💖
        </p>

        <br>

        <button onclick="document.getElementById('surpriseModal').style.display='none'"
                style="padding:10px 25px;border:none;border-radius:30px;background:#ff4081;color:#fff;cursor:pointer;">
            Close ❤️
        </button>
    </div>
</div>
<script>
const text = `Some people walk into our lives and make everything brighter, and you are one of those special people. Thank you for always being there for me, listening to me, supporting me, and filling my life with beautiful memories. Your kindness, trust, and care mean more than words can express.

Wishing you endless happiness, success, good health, and countless reasons to smile. Happy Friendship Day, my dear friend! 💖`;

const msg = document.getElementById("msg");
let i = 0;

function type() {
    if (i < text.length) {
        msg.textContent += text.charAt(i);
        i++;
        setTimeout(type, 30);
    }
}
type();

// Floating emojis
const particles = document.getElementById("particles");
const emojis = ["💖","🌸","✨","💕","🌺"];

for(let i=0;i<40;i++){
    const span=document.createElement("span");
    span.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
    span.style.left=Math.random()*100+"%";
    span.style.animationDuration=(6+Math.random()*6)+"s";
    span.style.animationDelay=Math.random()*5+"s";
    particles.appendChild(span);
}

// Canvas
const canvas=document.getElementById("cv");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let confetti=[];

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    confetti.forEach((p,index)=>{
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,5,5);

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.08;
        p.life--;

        if(p.life<=0){
            confetti.splice(index,1);
        }
    });

    requestAnimationFrame(animate);
}
animate();

// Popup Function
function showSurprise(){

    document.getElementById("surpriseModal").style.display="flex";

    confetti=[];

    for(let i=0;i<200;i++){
        confetti.push({
            x:window.innerWidth/2,
            y:window.innerHeight/2,
            vx:(Math.random()-0.5)*10,
            vy:(Math.random()-0.5)*10,
            life:120,
            color:`hsl(${Math.random()*360},100%,50%)`
        });
    }
}
</script></body></html>
