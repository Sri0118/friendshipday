<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Friendship Day ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#ff5ea8,#8a5cff,#4facfe);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
width:90%;
max-width:420px;
text-align:center;
padding:30px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
font-size:32px;
margin-bottom:20px;
}

h2{
font-size:26px;
color:#ffe600;
margin-bottom:20px;
}

p{
font-size:19px;
line-height:1.8;
min-height:130px;
}

button{
padding:14px 35px;
margin-top:25px;
font-size:18px;
border:none;
border-radius:50px;
background:white;
color:#ff2b7a;
font-weight:bold;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

#main{
display:none;
}

#wish{
display:none;
font-size:22px;
margin-top:25px;
color:#fff9a5;
}

.heart{
position:absolute;
color:pink;
font-size:24px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100px);
}
100%{
transform:translateY(110vh);
}
}
</style>

</head>

<body>

<div class="container">

<div id="intro">
<h1>🎁</h1>

<h2>Someone Special Has A Surprise For You ❤️</h2>

<button onclick="start()">Open Surprise</button>

</div>

<div id="main">

<h2>Dear Vanisri ❤️</h2>

<p id="text"></p>

<div id="wish">

💖 Happy Friendship Day 💖

<br><br>

Thank you for being the wonderful friend you are.

May your life always be filled with happiness,
success, laughter, and beautiful memories.

🌸✨ Forever Friends ✨🌸

</div>

</div>

</div>

<script>

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*4)+"s";

h.style.animationDelay=Math.random()*4+"s";

document.body.appendChild(h);

}

const messages=[

"Some people come into our lives unexpectedly...",

"They become our biggest strength...",

"They make every moment beautiful...",

"You are one of those precious people...",

"Thank you for every smile...",

"Thank you for every memory...",

"I'm lucky to have a best friend like you ❤️"

];

let i=0;

function start(){

document.getElementById("intro").style.display="none";

document.getElementById("main").style.display="block";

let box=document.getElementById("text");

let timer=setInterval(()=>{

if(i<messages.length){

box.innerHTML=messages[i];

i++;

}else{

clearInterval(timer);

document.getElementById("wish").style.display="block";

}

},2200);

}

</script>

</body>
</html>
